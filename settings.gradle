pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri('https://jitpack.io')
            content { includeGroup 'com.github.bhlangonijr' }
        }
    }
}
rootProject.name = "google-tv-apps"
include ':home'
project(':home').projectDir = file('apps/home')
include ':clock'
project(':clock').projectDir = file('apps/clock')
include ':chessMath'
project(':chessMath').projectDir = file('apps/chess-math')
