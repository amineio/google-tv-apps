name: Family Home
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-home:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/family-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint, release, and device test compilation
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest lintRelease assembleRelease assembleDebugAndroidTest --console=plain
      - name: Release size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = Path('build/outputs/apk/release/family-home-release.apk').stat().st_size
          print(f'Family Home: {size} bytes (limit 4194304)')
          assert size < 4194304, 'Family Home exceeds its 4 MiB release budget'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: family-home
          path: apps/family-home/build/outputs/apk/release/family-home-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-home-reports
          path: apps/family-home/build/reports/
